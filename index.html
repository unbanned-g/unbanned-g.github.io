        const seen = new Set();
        const uniqueGames = gamesData.filter(g => {
            const key = g.title.toLowerCase();
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });

        let filteredGames = [...uniqueGames];
        let currentView = 'grid';
        let currentCategory = 'All';

        function init() {
            renderGames();
            document.getElementById('searchInput').addEventListener('keypress', handleKeyPress);
        }

        function filterByCategory(category) {
            currentCategory = category;
            if (category === 'All') {
                filteredGames = [...uniqueGames];
            } else {
                filteredGames = uniqueGames.filter(game => game.category === category);
            }
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGames();
        }

        function renderGames() {
            if (currentView === 'grid') renderGridView();
            else renderListView();
        }

        function renderGridView() {
            const grid = document.getElementById('gridView');
            grid.innerHTML = '';
            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.style.backgroundImage = `url('${game.img || ''}')`;
                card.style.backgroundSize = 'cover';
                card.style.backgroundPosition = 'center';
                card.onclick = () => { if (game.href) window.open(game.href, '_blank'); };
                const overlay = document.createElement('div');
                overlay.className = 'game-info-overlay';
                const title = document.createElement('div');
                title.className = 'game-title';
                title.textContent = game.title;
                const cat = document.createElement('div');
                cat.className = 'game-category';
                cat.textContent = game.category;
                const tagsContainer = document.createElement('div');
                tagsContainer.className = 'game-tags';
                game.tags.slice(0, 2).forEach(tag => {
                    const t = document.createElement('span');
                    t.className = 'game-tag';
                    t.textContent = tag;
                    tagsContainer.appendChild(t);
                });
                overlay.appendChild(title);
                overlay.appendChild(cat);
                overlay.appendChild(tagsContainer);
                card.appendChild(overlay);
                grid.appendChild(card);
            });
        }

        function renderListView() {
            const list = document.getElementById('listView');
            list.innerHTML = '';
            filteredGames.forEach(game => {
                const item = document.createElement('div');
                item.className = 'game-item';
                item.onclick = () => { if (game.href) window.open(game.href, '_blank'); };
                const tagsHTML = game.tags.map(tag => `<span class="game-item-tag">${tag}</span>`).join('');
                item.innerHTML = `
                    <img src="${game.img || ''}" alt="${game.title}" onerror="this.style.display='none'">
                    <div class="game-item-info">
                        <div class="game-item-title">${game.title}</div>
                        <div class="game-item-category">📁 ${game.category}</div>
                        <div class="game-item-tags">${tagsHTML}</div>
                    </div>
                    <div class="view-icon"><i class="fas fa-arrow-right"></i></div>
                `;
                list.appendChild(item);
            });
        }

        function toggleView(view) {
            currentView = view;
            document.getElementById('gridView').classList.toggle('hidden', view !== 'grid');
            document.getElementById('listView').classList.toggle('hidden', view !== 'list');
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.view-btn').classList.add('active');
            renderGames();
        }

        function searchGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (currentCategory === 'All') {
                filteredGames = uniqueGames.filter(g => g.title.toLowerCase().includes(query));
            } else {
                filteredGames = uniqueGames.filter(g => g.category === currentCategory && g.title.toLowerCase().includes(query));
            }
            renderGames();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') searchGames();
        }

        function playRandomGame() {
            if (filteredGames.length === 0) return;
            const rand = filteredGames[Math.floor(Math.random() * filteredGames.length)];
            if (rand.href) window.open(rand.href, '_blank');
        }

        function panicMode() {
            document.body.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%); font-family: Arial, sans-serif;">
                    <div style="text-align: center; color: white;">
                        <h1 style="color: #00ff88; font-size: 3em; margin-bottom: 20px; text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);">📚 Study Materials</h1>
                        <p style="color: #00ffff; font-size: 1.2em; margin-bottom: 30px;">Calculus Textbook - Chapter 5: Integration</p>
                        <div style="background: rgba(0, 255, 136, 0.1); padding: 40px; border-radius: 10px; max-width: 600px; text-align: left; border: 2px solid #00ff88;">
                            <h2 style="color: #00ff88;">Key Concepts</h2>
                            <ul style="color: #00ffff; line-height: 1.8;">
                                <li>Fundamental Theorem of Calculus</li>
                                <li>Integration by Parts</li>
                                <li>Substitution Methods</li>
                                <li>Definite and Indefinite Integrals</li>
                            </ul>
                        </div>
                        <button onclick="location.reload()" style="margin-top: 30px; padding: 12px 30px; background: linear-gradient(135deg, #00ff88, #00ffff); color: #0a0e27; border: none; border-radius: 25px; cursor: pointer; font-size: 1em; font-weight: bold; box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);">Back to Games</button>
                    </div>
                </div>
            `;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === '~' || e.key === '`') {
                e.preventDefault();
                panicMode();
            }
        });

        window.addEventListener('load', init);
    </script>
